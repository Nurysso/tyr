[package]
name = "tyr"
version = "0.4.6"
edition = "2024"
rust-version = "1.97"
description = "A smart file organizer that sorts files by extension categories or filename patterns"
readme = "README.md"
homepage = "https://github.com/Nurysso/tyr"
repository = "https://github.com/Nurysso/tyr"
license = "GPL-3.0-or-later"
keywords = ["cli", "file", "filesystem", "organizer", "utility"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "tyr"
path = "src/main.rs"

[dependencies]
chrono = "0.4.42"
clap = "4.5.46"
crossterm = "0.27.0"
dirs = "5.0.1"
ratatui = "0.30.2"
rayon = "1.11.0"
regex = "1.11.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8.23"

[profile.release]
opt-level = 3
debug = true
strip = true
lto = true
panic = "abort"
codegen-units = 1
